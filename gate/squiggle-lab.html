<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gentle Focus — living timers</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      padding: 48px 24px;
    }
    .page-title {
      text-align: center;
      font-family: var(--font-serif);
      font-weight: 500;
      margin: 0 0 8px;
    }
    .page-note {
      text-align: center;
      color: var(--muted);
      font-size: var(--fs-sm);
      margin: 0 0 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 820px;
      margin: 0 auto;
    }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--ring);
      border-radius: var(--r-lg);
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .variant-label {
      font-size: var(--fs-xs);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 0 0 6px;
    }
    .variant-name {
      font-family: var(--font-serif);
      font-size: var(--fs-md);
      margin: 0 0 24px;
    }
    .bar { display: block; width: 100%; height: 72px; }
    .track { fill: none; stroke: var(--ring); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .prog  { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .head  { fill: var(--accent); }
    .caption { margin: 22px 0 0; color: var(--muted); font-size: var(--fs-sm); }
  </style>
</head>
<body>
  <h2 class="page-title">Living timers — four squiggles</h2>
  <p class="page-note">A gentle line that fills as you wait, with a soft head leading the way. Each loops every 15s.</p>

  <div class="grid" id="grid"></div>

  <script>
    const W = 300, H = 72, MID = 36
    const DUR = 15
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches

    const dials = [
      { key: 'A', label: 'A · Slither',   name: 'A traveling ripple',      type: 'travel',   freq: 3.0, amp: 9,  speed: 1.2 },
      { key: 'B', label: 'B · Inchworm',  name: 'A worm to the finish',    type: 'worm',     freq: 2.4, amp: 8,  speed: 1.4, wormFrac: 0.26 },
      { key: 'C', label: 'C · Meander',   name: 'Lazy river curves',       type: 'meander',  freq: 1.4, amp: 15, speed: 0.7 },
      { key: 'D', label: 'D · Breathing', name: 'A wave that breathes',    type: 'breathe',  freq: 2.6, ampMin: 4, ampMax: 14, speed: 1.0, breath: 0.85 }
    ]

    const grid = document.getElementById('grid')
    const svgNS = 'http://www.w3.org/2000/svg'

    for (const d of dials) {
      const card = document.createElement('div')
      card.className = 'card'
      card.innerHTML =
        `<p class="variant-label">${d.label}</p>` +
        `<p class="variant-name">${d.name}</p>` +
        `<svg class="bar" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">` +
          `<path class="track"></path><path class="prog"></path><circle class="head" r="7"></circle>` +
        `</svg>` +
        `<p class="caption">A short pause, then you can continue.</p>`
      grid.appendChild(card)
      d.track = card.querySelector('.track')
      d.prog = card.querySelector('.prog')
      d.head = card.querySelector('.head')
    }

    const PAD = 14
    function waveY(x, d, t) {
      const ph = ((x - PAD) / (W - 2 * PAD)) * Math.PI * 2 * d.freq
      let A = d.amp
      if (d.type === 'breathe') A = d.ampMin + (d.ampMax - d.ampMin) * (0.5 + 0.5 * Math.sin(t * d.breath))
      let y = A * Math.sin(ph - t * d.speed)
      y += A * 0.3 * Math.sin(ph * 1.9 - t * d.speed * 1.5 + 1.1)
      return y
    }

    function buildPath(d, t) {
      const steps = 120
      let out = ''
      for (let i = 0; i <= steps; i++) {
        const x = PAD + (i / steps) * (W - 2 * PAD)
        const y = MID + waveY(x, d, t)
        out += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2) + ' '
      }
      return out
    }

    function frame(t, p) {
      for (const d of dials) {
        const path = buildPath(d, t)
        d.track.setAttribute('d', path)
        d.prog.setAttribute('d', path)
        const len = d.prog.getTotalLength()
        let headAt
        if (d.type === 'worm') {
          const wl = len * d.wormFrac
          d.prog.style.strokeDasharray = `${wl} ${len + wl}`
          d.prog.style.strokeDashoffset = `${-(p * (len - wl))}`
          headAt = p * (len - wl) + wl
        } else {
          d.prog.style.strokeDasharray = `${len}`
          d.prog.style.strokeDashoffset = `${len * (1 - p)}`
          headAt = p * len
        }
        const pt = d.prog.getPointAtLength(Math.min(headAt, len))
        d.head.setAttribute('cx', pt.x.toFixed(2))
        d.head.setAttribute('cy', pt.y.toFixed(2))
      }
    }

    frame(0, reduce ? 0.6 : 0)
    if (!reduce) {
      const start = performance.now()
      function loop(now) {
        const elapsed = (now - start) / 1000
        const p = (elapsed % DUR) / DUR
        frame(elapsed, p)
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    }
  </script>
</body>
</html>
