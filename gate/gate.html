<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gentle Focus</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="gate.css">
</head>
<body>
  <main class="card">
    <p class="wordmark">
      <span class="breath-mark" aria-hidden="true"></span>
      <span>gentle</span><span class="wm-dot" aria-hidden="true"></span><span>focus</span>
    </p>
    <h1 id="title">…</h1>
    <p class="sub" id="sub" aria-live="polite"></p>
    <p class="gate-stat" id="gateStat" hidden></p>

    <div id="chooser" class="chooser" hidden></div>

    <section id="friction" class="friction" hidden>
      <div id="mount" class="mount"></div>
      <div id="dwell" class="dwell" hidden><span id="count"></span></div>
      <button id="continue" class="primary" disabled>Continue</button>
      <button id="switchTimer" class="link" hidden>Rather just wait it out?</button>
    </section>

    <div class="footer-links" id="footerLinks">
      <a href="#" id="overrideLink" class="quiet">I need this page for something important</a>
      <a href="#" id="optionsLink" class="quiet">Settings</a>
    </div>
  </main>

  <div id="overrideBackdrop" class="backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
      <h2 id="ovTitle">This is your call.</h2>
      <p class="ov-body">You set this block up for a reason — but you're the one in charge, not us. We're not here to stop you, just to make sure this is a choice and not a reflex.</p>
      <label class="ov-duration">
        <span>If you continue, this page will be unblocked for:</span>
        <select id="ovDuration">
          <option value="5">5 minutes</option>
          <option value="15" selected>15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">60 minutes</option>
        </select>
      </label>
      <div class="ov-actions">
        <button id="ovBack" class="primary">Take a breath, go back</button>
        <button id="ovUnlock" class="ghost" disabled>I understand — unlock</button>
      </div>
    </div>
  </div>

  <script type="module" src="gate.js"></script>
</body>
</html>
